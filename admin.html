<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — URUGUAY FARM</title><link rel="stylesheet" href="styles.css"><style>
main{max-width:1200px;margin:auto;padding:45px 5vw}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#15110c;border:1px solid #3b2e1d;padding:20px;border-radius:16px;margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input,.form textarea{background:#120f0b;color:#fff;border:1px solid #4b3922;padding:13px;border-radius:10px}.form textarea,.wide{grid-column:1/-1}.preview{width:120px;height:120px;object-fit:cover;border-radius:12px;display:none}.list{display:grid;gap:10px}.prod{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;border-top:1px solid #3b2e1d;padding:12px 0}.prod img{width:70px;height:70px;object-fit:cover;border-radius:10px;background:#1a140d}.actions{display:flex;gap:8px;flex-wrap:wrap}.admin-table{width:100%;border-collapse:collapse}.admin-table td,.admin-table th{padding:12px;border-bottom:1px solid #3b2e1d;text-align:left;font-size:12px}.editbox{display:none;margin-top:16px;border-top:1px solid #3b2e1d;padding-top:18px}.editbox.show{display:block}@media(max-width:800px){.cards,.form{grid-template-columns:1fr}.prod{grid-template-columns:55px 1fr}.actions{grid-column:1/-1}.admin-table{font-size:10px}}</style></head><body>
<header><a class="logo" href="index.html">URUGUAY <span>FARM</span></a><span>PAINEL ADMIN</span></header><main>
<div class="cards"><div class="card"><small>Saldo Plus Pix</small><h2 id="balance">—</h2></div><div class="card"><small>Pedidos</small><h2 id="ordersCount">—</h2></div><div class="card"><small>Produtos</small><h2 id="productsCount">—</h2></div><div class="card"><small>Status</small><h2>Online</h2></div></div>
<section class="card"><small>CATÁLOGO</small><h2>Adicionar produto</h2><div class="form"><input id="name" placeholder="Nome do produto"><input id="price" type="number" step=".01" placeholder="Preço (ex: 29.90)"><input id="stock" type="number" placeholder="Estoque"><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><textarea id="description" rows="4" placeholder="Descrição do produto"></textarea><img id="preview" class="preview"><button class="btn wide" id="addBtn">Cadastrar produto</button></div></section>
<section class="card"><small>SEUS PRODUTOS</small><h2>Gerenciar catálogo</h2><div id="productList" class="list"></div>
<div id="editBox" class="editbox"><h2>Editar produto</h2><div class="form"><input id="editName" placeholder="Nome"><input id="editPrice" type="number" step=".01" placeholder="Preço"><input id="editStock" type="number" placeholder="Estoque"><input id="editPhoto" type="file" accept="image/png,image/jpeg,image/webp"><textarea id="editDescription" rows="4" placeholder="Descrição"></textarea><img id="editPreview" class="preview"><button class="btn wide" id="saveEdit">Salvar alterações</button><button class="wide" id="cancelEdit">Cancelar edição</button></div></div></section>
<section class="card"><small>VENDAS</small><h2>Pedidos</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th><th>Transação</th></tr></thead><tbody id="orders"></tbody></table></div></section>
</main><script>
const auth="Basic "+btoa((prompt("Usuário admin:")||"admin")+":"+(prompt("Senha admin:")||""));
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:auth,"Content-Type":"application/json"};const r=await fetch(u,o);let d=await r.json().catch(()=>({}));if(r.status===401){alert("Acesso negado");throw 0}if(!r.ok)throw new Error(d.message||"Erro");return d}
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});let imageData="",productsCache=[],editingId=null,editImageData="";
photo.onchange=()=>{const f=photo.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;preview.src=imageData;preview.style.display="block"};r.readAsDataURL(f)};
editPhoto.onchange=()=>{const f=editPhoto.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{editImageData=r.result;editPreview.src=editImageData;editPreview.style.display="block"};r.readAsDataURL(f)};
async function load(){const [o,p,b]=await Promise.all([api("/api/admin/orders"),api("/api/admin/products"),api("/api/admin/balance").catch(()=>({}))]);productsCache=p;ordersCount.textContent=o.length;productsCount.textContent=p.length;balance.textContent=b.balance??b.amount??"—";orders.innerHTML=o.map(x=>`<tr><td>${x.code}</td><td>${x.customer_name||""}</td><td>${money(x.total)}</td><td>${x.status}</td><td>${x.transaction_id||"—"}</td></tr>`).join("");productList.innerHTML=p.filter(x=>String(x.name).toLowerCase()!=="vortex v01").map(x=>`<div class="prod"><img src="${x.image||""}" alt=""><div><b>${x.name}</b><br><small>${money(x.price)} • Estoque ${x.stock} • ${x.active?"Ativo":"Oculto"}</small></div><div class="actions"><button onclick="editProduct(${x.id})">Editar</button><button onclick="toggle(${x.id},${x.active?0:1})">${x.active?"Ocultar":"Ativar"}</button></div></div>`).join("")||"<p>Nenhum produto cadastrado ainda.</p>"}
addBtn.onclick=async()=>{try{const nameEl=document.getElementById("name"),descriptionEl=document.getElementById("description"),priceEl=document.getElementById("price"),stockEl=document.getElementById("stock"),photoEl=document.getElementById("photo"),previewEl=document.getElementById("preview");await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:nameEl.value.trim(),description:descriptionEl.value.trim(),image:imageData,price:priceEl.value,stock:stockEl.value})});alert("Produto cadastrado!");nameEl.value=descriptionEl.value=priceEl.value=stockEl.value="";photoEl.value="";imageData="";previewEl.style.display="none";load()}catch(e){alert(e.message)}};
function editProduct(id){const p=productsCache.find(x=>+x.id===+id);if(!p)return;editingId=id;editImageData="";editName.value=p.name||"";editPrice.value=p.price??"";editStock.value=p.stock??"";editDescription.value=p.description||"";editPhoto.value="";if(p.image){editPreview.src=p.image;editPreview.style.display="block"}else editPreview.style.display="none";editBox.classList.add("show");editBox.scrollIntoView({behavior:"smooth",block:"center"})}
saveEdit.onclick=async()=>{if(!editingId)return;try{const body={name:editName.value.trim(),description:editDescription.value.trim(),price:editPrice.value,stock:editStock.value};if(editImageData)body.imageData=editImageData;await api("/api/admin/products/"+editingId,{method:"PATCH",body:JSON.stringify(body)});alert("Produto atualizado!");closeEdit();load()}catch(e){alert(e.message)}};
function closeEdit(){editingId=null;editImageData="";editPhoto.value="";editBox.classList.remove("show")}
cancelEdit.onclick=closeEdit;
async function toggle(id,active){await api("/api/admin/products/"+id,{method:"PATCH",body:JSON.stringify({active})});load()}load();
</script></body></html>
