<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — URUGUAY FARM</title><link rel="stylesheet" href="styles.css"><style>.checkout{max-width:1050px;margin:auto;padding:55px 20px}.box{background:#121712;border:1px solid #293329;border-radius:18px;padding:24px;margin:16px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields input,.copy{width:100%;padding:14px;background:#0b0d0b;color:#fff;border:1px solid #334033;border-radius:12px}.pix{display:none;text-align:center}.pix.show{display:block}.qr{max-width:260px;background:white;padding:10px}.total{font-size:26px;color:#9bf00b;font-weight:800}@media(max-width:700px){.fields{grid-template-columns:1fr}}</style></head><body><header><a class="logo" href="index.html">URUGUAY <span>FARM</span></a><a class="btn" href="index.html">← Voltar</a></header><main class="checkout"><small>CHECKOUT SEGURO</small><h2>Finalizar pedido</h2><div class="box"><h3>Seus dados</h3><div class="fields"><input id="name" placeholder="Nome completo"><input id="email" placeholder="E-mail"><input id="phone" placeholder="Telefone"><input id="document" placeholder="CPF/CNPJ"><input id="cep" placeholder="CEP"><input id="number" placeholder="Número"><input id="street" placeholder="Rua"><input id="district" placeholder="Bairro"><input id="city" placeholder="Cidade"><input id="state" placeholder="UF"></div></div><div class="box"><h3>Pagamento via PIX</h3><button class="btn" id="pay">Gerar PIX</button></div><div class="box pix" id="pix"><h3>PIX gerado</h3><img id="qr" class="qr"><p>PIX Copia e Cola</p><input id="copy" class="copy" readonly><button class="btn" id="copyBtn">Copiar código</button><br><br><button class="btn" id="checkPayment">Já paguei — verificar pagamento</button><p id="status">Aguardando pagamento...</p></div><div class="box"><h3>Total</h3><div id="total" class="total">—</div></div></main><script>const cart=JSON.parse(localStorage.getItem("plastRodasCart")||"[]");let total=cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||1),0);document.getElementById("total").textContent=total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});document.getElementById("copyBtn").onclick=()=>navigator.clipboard.writeText(document.getElementById("copy").value);let tx=null;document.getElementById("pay").onclick=async()=>{const v=id=>document.getElementById(id).value.trim(),c={name:v("name"),email:v("email"),phone:v("phone"),document:v("document").replace(/\D/g,""),cep:v("cep"),number:v("number"),street:v("street"),district:v("district"),city:v("city"),state:v("state")};if(!c.name||!c.document)return alert("Preencha nome e CPF/CNPJ.");const r=await fetch("/api/payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer:c,items:cart})}),d=await r.json();if(!r.ok)return alert(d.message||"Erro");tx=d.transactionId;document.getElementById("qr").src=d.qrcodeUrl;document.getElementById("copy").value=d.copyPaste;document.getElementById("pix").classList.add("show");document.getElementById("pay").disabled=true};
document.getElementById("checkPayment").onclick=async()=>{if(!tx)return alert("Gere o PIX primeiro.");const btn=document.getElementById("checkPayment"),st=document.getElementById("status");btn.disabled=true;st.textContent="Verificando pagamento...";try{const r=await fetch("/api/payment/"+encodeURIComponent(tx)),d=await r.json().catch(()=>({}));if(!r.ok){st.textContent="Não foi possível verificar agora.";alert(d.message||"Erro ao consultar pagamento");return}const s=String(d.status||"").toUpperCase();if(["PAGO","PAID","COMPLETO","COMPLETED","APROVADO","APPROVED"].includes(s)){st.textContent="Pagamento confirmado!";localStorage.removeItem("plastRodasCart");alert("Pagamento confirmado com sucesso!")}else{st.textContent="Pagamento ainda não confirmado.";alert("O PIX ainda não consta como pago.")}}catch(e){st.textContent="Erro ao verificar pagamento.";alert("Não foi possível consultar o pagamento.")}finally{btn.disabled=false}};</script></body></html>
